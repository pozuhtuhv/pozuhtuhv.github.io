
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="naver-site-verification" content="565f41042384b9e0c6b69e3554fa6b58610b557c" />
{% assign page_title = page.title | default: site.title %}
{% assign page_desc = page.description | default: page.excerpt | strip_html | strip_newlines | truncate: 150 | default: site.description %}
<meta name="description" content="{{ page_desc | escape }}">

<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:title" content="{{ page_title | escape }}">
<meta property="og:description" content="{{ page_desc | escape }}">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:locale" content="ko_KR">
<meta property="og:image" content="{{ page.image | default: '/favicon-180.png' | prepend: site.url }}">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="{{ site.url | append: page.url }}">

<title>
  {% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}
</title>

<link rel="icon" href="{{ site.url }}/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="{{ site.url }}/favicon-180.png">
<link rel="preload" href="{{ site.url }}/assets/css/syntax.css" as="style" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ site.url }}/assets/css/syntax.css"></noscript>

<link rel="preload" href="{{ site.url }}/assets/css/giscus.css" as="style" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ site.url }}/assets/css/giscus.css"></noscript>

<script src="{{ site.url }}/assets/js/custom.js" defer></script>
<link rel="sitemap" type="application/xml" href="{{ site.url }}/sitemap.xml" />

{% include analytics.html %}

<style>
  {% capture include_to_scssify %}
    {% include inline.scss %}
  {% endcapture %}
  {{ include_to_scssify | scssify }}
</style>
